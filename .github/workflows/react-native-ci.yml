name: React Native CI

on:
  push:
    branches: [main]
    paths: ['react-native/**', '.github/workflows/react-native-ci.yml']
  pull_request:
    paths: ['react-native/**', '.github/workflows/react-native-ci.yml']

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: react-native
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: react-native/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
