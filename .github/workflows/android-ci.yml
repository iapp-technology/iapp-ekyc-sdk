name: Android CI

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'settings.gradle.kts'
      - 'build.gradle.kts'
      - 'gradle/**'
      - 'gradle.properties'
      - 'jitpack.yml'
      - '.github/workflows/android-ci.yml'
  pull_request:
    paths:
      - 'android/**'
      - 'settings.gradle.kts'
      - 'build.gradle.kts'
      - 'gradle/**'
      - 'gradle.properties'
      - 'jitpack.yml'
      - '.github/workflows/android-ci.yml'

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Library (release + unit tests)
        run: ./gradlew :ekyc-sdk:assembleRelease :ekyc-sdk:testReleaseUnitTest
      - name: Example app (Kotlin + Java usage compiles)
        working-directory: android/example
        run: ./gradlew :app:assembleDebug
