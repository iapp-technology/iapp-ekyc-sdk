name: iapp_ekyc_sdk
description: >-
  iApp eKYC SDK for Flutter — Thai ID / passport document auto-capture with
  OCR, face verification, passive liveness, and active liveness challenges
  powered by the iApp AI platform (https://iapp.co.th).
version: 0.1.0
homepage: https://iapp.co.th
repository: https://github.com/iapp-technology/iapp-ekyc-sdk

environment:
  sdk: ^3.8.0
  flutter: ">=3.32.0"

dependencies:
  flutter:
    sdk: flutter
  camera: ^0.11.2+1
  google_mlkit_face_detection: ^0.13.2
  opencv_dart: ^1.4.5
  http: ^1.6.0
  http_parser: ^4.0.2
  crypto: ^3.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
